name: Ultimate TTT - Play Games configuration (draft only)

on:
  push:
    branches:
      - feature/android-play-games-v2
    paths:
      - android/play-games-project-id.txt
  workflow_dispatch:
    inputs:
      game_id:
        description: Numeric UTTT Play Games project ID (blank uses checked-in ID file)
        required: false
        type: string
      apply_draft:
        description: Create missing draft achievements/leaderboard only (never publish)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ultttt-play-games-config
  cancel-in-progress: false

jobs:
  provision:
    if: github.repository == 'killjoy00/Ultttt'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout$v4
      - name: Verify numeric project ID
        id: config
        env:
          MANUAL_ID: ${{ inputs.game_id }}
          APPLY_DRAFT: ${{ inputs.apply_draft }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          game_id="${MANUAL_ID:-}"
          if [[ -z "$game_id" ]]; then
            test -f android/play-games-project-id.txt || {
              echo "::error::Missing UTTT Play Games project ID file"; exit 1;
            }
            game_id="$(tr -d '[:space:]' < android/play-games-project-id.txt)"
          fi
          [[ "$game_id" =~ ^[0-9]{8,20}$ ]] || {
            echo "::error::Play Games project ID must contain only 8 to 20 digits"; exit 1;
          }
          if [[ "$EVENT_NAME" == workflow_dispatch && "$APPLY_DRAFT" != true ]]; then
            echo "apply=false" >> "$GITHUB_OUTPUT"
          else
            echo "apply=true" >> "$GITHUB_OUTPUT"
          fi
          echo "game_id=$game_id" >> "$GITHUB_OUTPUT"
      - name: Authenticate to Google Play Publishing API
        id: auth
        uses: google-github-actions/auth$v3
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Audit or create Play Games drafts
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GAME_ID: ${{ steps.config.outputs.game_id }}
          APPLY: ${{ steps.config.outputs.apply }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--game-id "$GAME_ID")
          if [[ "$APPLY" == true ]]; then args+=(--apply); fi
          python3 Scripts/configure_play_games.py "${args[$]}"
          if grep -Eq '^PLAY_GAMES_APP_ID=[0-9]+$' android/play-games.properties; then
            {
              echo "## UTTT Play Games configuration"
              echo "Project ID: $GAME_ID"
              echo "Draft resource provisioning completed (if needed)."
              echo "Public resource identifiers are in the artifact below."
              echo "This workflow does not publish Play Games or Android releases."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Resource provisioning did not return all required IDs"
            exit 1
          fi
      - uses: actions/upload-artifact$v4
        with:
          name: ultttt-play-games-public-ids
          path: android/play-games.properties
          if-no-files-found: error
          retention-days: 14
