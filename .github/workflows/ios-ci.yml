name: iOS CI
on:
  push:
    paths-ignore:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths-ignore:
      - 'android/**'
      - '.github/workflows/android-ci.yml'

# Do not keep running outdated PR revisions; never cancel main/manual work.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rules-tests:
    name: Game rules tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - run: swift test

  simulator-build:
    name: iPhone simulator build
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Verify iOS 27 SDK
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          major="${sdk%%.*}"
          if (( major < 27 )); then echo "::error::iOS 27 SDK required, found $sdk"; exit 1; fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate app icon
        run: swift tools/generate-app-icon.swift
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build without signing
        run: |
          xcodebuild \
            -project UltimateTTT.xcodeproj \
            -scheme UltimateTTT \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
