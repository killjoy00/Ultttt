name: Verify live UTTT Neon multiplayer API
on:
  push:
    branches: [automation/ultttt-neon-function-bundle]
    paths: [.github/workflows/ultttt-neon-live-test.yml]
permissions:
  contents: read
jobs:
  live-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exercise guest identity, matchmaking, turn rules, resume
        env:
          UTTT_URL: https://br-crimson-haze-bdif60qf-ulttttonline.compute.c-8.us-east-2.aws.neon.tech
        run: |
          node --input-type=module <<'JS'
          import { randomBytes } from 'node:crypto';
          import assert from 'node:assert/strict';
          const base=process.env.UTTT_URL;
          const a=randomBytes(32).toString('base64url');
          const b=randomBytes(32).toString('base64url');
          const c=randomBytes(32).toString('base64url');
          async function call(path,token,body,method){
            const response=await fetch(base+path,{
              method:method??(body===undefined?'GET':'POST'),
              headers:{...(token?{authorization:'Bearer '+token}:{}),'content-type':'application/json'},
              ...(body===undefined?{}:{body:JSON.stringify(body)}),
              signal:AbortSignal.timeout(25000)
            });
            const payload=await response.json();
            return {status:response.status,payload};
          }
          function eq(label,actual,expected){assert.equal(actual,expected,label);console.log('PASS',label);}
          let r=await call('/matches');
          eq('missing bearer token denied',r.status,401);
          r=await call('/health',a);
          eq('healthy database connection',r.status,200);
          eq('healthy SQL probe',r.payload.ok,true);
          r=await call('/matches/create',a,{});
          eq('private invite created',r.status,200);
          const m=r.payload;
          assert.match(m.invite_code,/^[A-F0-9]{12}$/);
          eq('initial X alias',m.player_x,'self');
          eq('waiting before join',m.status,'waiting');
          const j=await call('/matches/join',b,{invite_code:m.invite_code});
          eq('opponent joins invite',j.status,200);
          eq('opponent is self in own view',j.payload.player_o,'self');
          const outsider=await call('/matches/'+m.id,c);
          eq('stranger cannot read game',outsider.status,404);
          const wrong=await call('/matches/move',b,{match_id:m.id,board:4,cell:2,expected_moves:0});
          eq('out of turn move rejected',wrong.status,409);
          const ok=await call('/matches/move',a,{match_id:m.id,board:4,cell:2,expected_moves:0});
          eq('valid first move saved',ok.status,200);
          eq('one move persisted',ok.payload.moves.length,1);
          const stale=await call('/matches/move',a,{match_id:m.id,board:4,cell:3,expected_moves:0});
          eq('stale move rejected',stale.status,409);
          const forbidden=await call('/matches/move',b,{match_id:m.id,board:1,cell:0,expected_moves:1});
          eq('forced board rule enforced',forbidden.status,409);
          const legal=await call('/matches/move',b,{match_id:m.id,board:2,cell:0,expected_moves:1});
          eq('second player legal move saved',legal.status,200);
          eq('two moves persisted',legal.payload.moves.length,2);
          const resumed=await call('/matches/'+m.id,a);
          eq('existing match resumes',resumed.status,200);
          eq('resumed history retained',resumed.payload.moves.length,2);
          const list=await call('/matches',b);
          eq('matches listed for guest B',list.status,200);
          assert.equal(list.payload.some(x=>x.id===m.id),true);
          console.log('PASS all live UTTT Neon two-guest API smoke checks');
          JS
