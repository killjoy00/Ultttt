name: Ultimate TTT - Google Play Production v2
# One-time production release following the version-1 icon rejection.
# This workflow publishes only when a deliberate marker commit is pushed
# to the dedicated release branch. It cannot publish on ordinary PRs/main pushes.
on:
  push:
    branches:
      - 'release/ultttt-play-v2'

permissions:
  contents: read

concurrency:
  group: ultimate-ttt-play-production-v2
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/release/ultttt-play-v2' && contains(github.event.head_commit.message, '[publish-ultttt-v2]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate existing upload credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_UPLOAD_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing ANDROID_UPLOAD_KEY_PASSWORD"; exit 1; }
          test -n "$PLAY_SERVICE_ACCOUNT" || { echo "::error::Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ultttt-upload.p12"
          chmod 600 "$RUNNER_TEMP/ultttt-upload.p12"
          keytool -list -keystore "$RUNNER_TEMP/ultttt-upload.p12" \
            -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -alias upload >/dev/null

      - name: Build and verify signed version-code-2 Play App Bundle
        env:
          ULTTTT_VERSION_CODE: '2'
          ULTTTT_VERSION_NAME: '1.0.1'
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/ultttt-upload.p12
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p android testDebugUnitTest bundleRelease
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          MAPPING=android/app/build/outputs/mapping/release/mapping.txt
          test -s "$AAB"
          test -s "$MAPPING"
          unzip -Z1 "$AAB" > "$RUNNER_TEMP/aab-contents.txt"
          grep -Fq 'BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map' "$RUNNER_TEMP/aab-contents.txt"
          jarsigner -verify "$AAB"
          if grep -q '^BUNDLE-METADATA/com.android.tools.build.debugsymbols/' "$RUNNER_TEMP/aab-contents.txt"; then
            echo "Native debug symbols included in AAB."
          else
            echo "::notice::Native debug metadata unavailable or dependencies pre-stripped. Not a Play blocker."
          fi

      - name: Archive exact signed bundle and corresponding symbol metadata
        uses: actions/upload-artifact@v4
        with:
          name: ultttt-google-play-v2-signed
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/mapping/release/mapping.txt
            android/app/build/outputs/native-debug-symbols/release/*.zip
          if-no-files-found: error
          retention-days: 90

      - name: Prepare player-facing release notes
        run: |
          mkdir -p "$RUNNER_TEMP/play-notes"
          cat > "$RUNNER_TEMP/play-notes/whatsnew-en-US" <<'NOTES'
          Nine boards. One big win.

          Play Ultimate Tic/Tac/Toe against the computer or a friend on the same device. Choose your next move carefully: each square sends your opponent to another board.

          Includes three computer difficulty levels, saved games, undo, replay, and light/dark themes. This update also improves turn highlighting and the app icon.
          NOTES

      - name: Submit corrected build to Google Play production
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.killjoy00.ultttt
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: production
          status: completed
          releaseName: Ultimate Tic/Tac/Toe 1.0.1
          whatsNewDirectory: ${{ runner.temp }}/play-notes
