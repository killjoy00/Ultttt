name: Android CI
on:
  push:
    paths:
      - 'android/**'
      - 'Scripts/configure_play_games.py'
      - 'Scripts/test_configure_play_games.py'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'Scripts/configure_play_games.py'
      - 'Scripts/test_configure_play_games.py'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test Play Games API provisioning (offline mocks)
        run: python3 -m unittest discover -s Scripts -p 'test_configure_play_games.py' -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests, debug APK, and optimized release App Bundle
        run: gradle --no-daemon -p android testDebugUnitTest assembleDebug bundleRelease
      - name: Verify release mapping and bundled native symbols
        shell: bash
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          MAPPING=android/app/build/outputs/mapping/release/mapping.txt
          test -s "$AAB"
          test -s "$MAPPING"
          unzip -Z1 "$AAB" > "$RUNNER_TEMP/ultttt-bundle-files.txt"
          grep -Fq 'BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map' "$RUNNER_TEMP/ultttt-bundle-files.txt"
          echo "R8 mapping exists and is embedded in the release App Bundle."
          if grep -q '^BUNDLE-METADATA/com.android.tools.build.debugsymbols/' "$RUNNER_TEMP/ultttt-bundle-files.txt"; then
            echo "Native debug symbols are embedded in the release App Bundle."
          elif grep -q '^base/lib/' "$RUNNER_TEMP/ultttt-bundle-files.txt"; then
            echo "::warning::AAB contains native libraries but no native debug symbols could be extracted. Some dependencies may be pre-stripped."
          else
            echo "AAB contains no bundled native libraries requiring debug metadata."
          fi
      - name: Verify packaged launcher icon and app name
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/ultttt-badging.txt"
          grep -q "^application-icon" "$RUNNER_TEMP/ultttt-badging.txt"
          grep -Fq "Ultimate Tic/Tac/Toe" "$RUNNER_TEMP/ultttt-badging.txt"
      - name: Verify packaged Play Games initialization and project ID
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/ultttt-manifest.txt"
          grep -Fq 'UlttttApplication' "$RUNNER_TEMP/ultttt-manifest.txt"
          grep -Fq 'com.google.android.gms.games.APP_ID' "$RUNNER_TEMP/ultttt-manifest.txt"
          "$AAPT" dump --values resources "$APK" > "$RUNNER_TEMP/ultttt-resources.txt"
          grep -Fq 'string/game_services_project_id' "$RUNNER_TEMP/ultttt-resources.txt"
          project_id=$(sed -n 's/^PLAY_GAMES_APP_ID=//p' android/play-games.properties)
          [[ "$project_id" =~ ^[0-9]+$ ]]
          grep -Fq "$project_id" "$RUNNER_TEMP/ultttt-resources.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ultimate-ttt-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Prevent a signed release from silently dropping multiplayer
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/configuration-check-only.p12
        run: |
          set -euo pipefail
          if ULTTTT_ONLINE_NEON_FUNCTION_URL='' gradle --no-daemon -p android help > "$RUNNER_TEMP/missing-online.log" 2>&1; then
            echo '::error::Signed configuration accepted a missing online endpoint.'
            exit 1
          fi
          grep -Fq 'Signed Android release requires ULTTTT_ONLINE_NEON_FUNCTION_URL' "$RUNNER_TEMP/missing-online.log"
          # Generate BuildConfig only: this check does not need an actual signing key.
          export ULTTTT_ONLINE_NEON_FUNCTION_URL='https://br-crimson-haze-bdif60qf-ulttttonline.compute.c-8.us-east-2.aws.neon.tech'
          gradle --no-daemon -p android :app:generateReleaseBuildConfig
          config=android/app/build/generated/source/buildConfig/release
          grep -RFq 'ONLINE_CONFIGURED = true' "$config"
          grep -RFq "$ULTTTT_ONLINE_NEON_FUNCTION_URL" "$config"
          grep -RFq 'PLAY_GAMES_CONFIGURED = true' "$config"
          grep -RFq '517518057047' "$config"
          echo 'Verified signed configuration retains both multiplayer and Play Games.'
