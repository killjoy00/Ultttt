name: UltimateTTT
options:
  bundleIdPrefix: com.killjoy00
  deploymentTarget:
    iOS: "17.0"
packages:
  UltimateTTTCore:
    path: .
targets:
  UltimateTTT:
    type: application
    platform: iOS
    sources:
      - path: UltimateTTTApp
    dependencies:
      - package: UltimateTTTCore
    info:
      path: UltimateTTTApp/Info.plist
      properties:
        CFBundleDisplayName: Ultimate Tic Tac Toe
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.killjoy00.ultttt
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
