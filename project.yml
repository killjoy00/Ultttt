name: UltimateTTT
options:
  bundleIdPrefix: com.killjoy00
  deploymentTarget:
    iOS: "17.0"
packages:
  UltimateTTTCore:
    path: .
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.12.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.1.0
targets:
  UltimateTTT:
    type: application
    platform: iOS
    sources:
      - path: UltimateTTTApp
    dependencies:
      - package: UltimateTTTCore
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    entitlements:
      path: UltimateTTTApp/UltimateTTT.entitlements
      properties:
        com.apple.developer.game-center: true
    info:
      path: UltimateTTTApp/Info.plist
      properties:
        CFBundleDisplayName: Ultimate Tic Tac Toe
        UILaunchScreen: {}
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.killjoy00.ultttt
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
